<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link css file -->
    <link rel="stylesheet" href="resources/style/supplierpayment.css">

    <!-- link js file -->
    <script src="controllerjs/supplierpayment.js"></script>

    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">
    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Supplier Payment
            </li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <!-- title area -->
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>Supplier Payment Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printSupplierPaymentTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="SupplierpaymentFormId" onsubmit="return false">
                                    <fieldset>
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="supplier" class="col-4 col-form-label fw-bold">
                                                        Supplier : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <select id="selectSupplier" class="form-select " onchange="selectDynamicValidator(this,'supplierpayment','supplier_id') ;
                                                            getGrnCodesBySupplier()">
                                                            <option value="" selected diasabled></option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="date" class="col-4 col-form-label fw-bold">
                                                        GRN No : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <select id="selectGrnNo" class="form-select " onchange="selectDynamicValidator(this,'supplierpayment','grn_id')
                                                            getTotalAmount() ">
                                                            <option value="" selected diasabled></option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="totalamount" class="col-4 col-form-label fw-bold">
                                                        Total amount : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-money-bill"></i>
                                                            </span>
                                                            <input type="text" id="textTotalAmount" class="form-control"
                                                                disabled
                                                                onchange="textValidator(this,'^(([1-9][0-9]{0,7})|([1-9][0-9]{0,7}[.][0-9]{2}))$','supplierpayment','total_amount')">
                                                            <!-- readonly -->
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="dueamount" class="col-4 col-form-label fw-bold">
                                                        Due amount : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-money-bill"></i>
                                                            </span>
                                                            <input type="text" id="textDueAmount" class="form-control"
                                                                disabled
                                                                onchange="textValidator(this,'^(([1-9][0-9]{0,7})|([1-9][0-9]{0,7}[.][0-9]{2}))$','supplierpayment','Due_amount')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="paidamount" class="col-4 col-form-label fw-bold">
                                                        Payment amount : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-money-bill"></i>
                                                            </span>
                                                            <input type="text" id="textPaymentAmount"
                                                                class="form-control"
                                                                onchange="textValidator(this,'^(([1-9][0-9]{0,7})|([1-9][0-9]{0,7}[.][0-9]{2}))$','supplierpayment','paymentAmount')"
                                                                oninput="getNewDueAmount()">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="newdueamount" class="col-4 col-form-label fw-bold">
                                                        New Due amount : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-money-bill"></i>
                                                            </span>
                                                            <input type="text" id="textNewDueAmount"
                                                                class="form-control" disabled
                                                                onchange="textValidator(this,'^(([1-9][0-9]{0,7})|([1-9][0-9]{0,7}[.][0-9]{2}))$','supplierpayment','newDueAmount')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                        </div><br>
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="paymentmethod" class="col-4 col-form-label fw-bold">
                                                        Payment method : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <select id="selectPaymentmethod" class="form-select " onchange="selectDynamicValidator(this,'supplierpayment','paymentMethod_id');
                                                            handlePaymentMethodChange(this.value) ">
                                                            <option value="" selected disabled></option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="paymentdate" class="col-4 col-form-label fw-bold">
                                                        Payment Date : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <input type="date" id="selectpaymentDate" class="form-control"
                                                            onchange="textValidator(this,'^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','supplierpayment','payment_date')">
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row align-items-center bankDetailColmn d-none">
                                            <div class="col-6">
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Bank Name : <span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-building-columns fa-xs"></i>
                                                            </span>
                                                            <select id="selectBank" class="form-select" required
                                                                onchange="selectDynamicValidator(this,'supplierpayment','bankname')">
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div><br>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Branch : <span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-location-pin fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textBranchName" class="form-control "
                                                                required placeholder=" Enter Branch Name"
                                                                onkeyup="textValidator(this,'^[A-Za-z]{4,20}$','supplierpayment','branch')">
                                                        </div>
                                                    </div>
                                                </div><br>
                                            </div>
                                        </div>
                                        <div class="row align-items-center bankDetailColmn d-none">
                                            <div class="col-6">
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Account Name :<span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-user fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textAccountName"
                                                                class="form-control " required
                                                                placeholder=" Enter Account Name"
                                                                onkeyup="textValidator(this,'^([A-Z][a-z]{2,20}[\\s])+([A-Z][a-z]{2,20})$','supplierpayment','accountname')">
                                                        </div>
                                                    </div>
                                                </div><br>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Account No :<span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-id-card fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textAccountNo" class="form-control "
                                                                required placeholder=" Enter Account Number"
                                                                onkeyup="textValidator(this,'^([0-9]{10,12})$','supplierpayment','accountno')">
                                                            <!-- ^\d{10,12}$   d kiynne only digits -->
                                                        </div>
                                                    </div>
                                                </div><br>
                                            </div>
                                        </div>
                                        <div class="row align-items-center d-none" id="paymentNoRow">
                                            <div class="col-6" id="transactionNoId">
                                                <div class="row align-items-center">
                                                    <label for="texttransactionNo" class="col-4 col-form-label fw-bold">
                                                        Transaction Reference No : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="col-8">
                                                            <input type="text" id="texttransactionNo"
                                                                class="form-control"
                                                                onchange="textValidator(this,'^[A-Za-z0-9- ]{3,15}$','supplierpayment','transferNo')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6" id="chequeNoId">
                                                <div class="row align-items-center">
                                                    <label for="textChequeNo" class="col-4 col-form-label fw-bold">
                                                        Cheque No : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <input type="text" id="textChequeNo" class="form-control"
                                                            onchange="textValidator(this,'^[A-Za-z0-9- ]{3,15}$','supplierpayment','checkNo')">
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row align-items-center d-none" id="transferdaterowId">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="transferdate" class="col-4 col-form-label fw-bold">
                                                        Transfer Date : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <input type="date" id="textTransferDate" class="form-control"
                                                            onchange="textValidator(this,'^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','supplierpayment','payment_date')">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </fieldset>


                                    <div class="row">
                                        <div class="col-4">
                                            <button type="button" onclick="refreshSupplierPaymentForm()"
                                                class="btn btnHover fw-bold btn-clear all-button">
                                                <i class="fa-solid fa-recycle"></i>
                                                Clear
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" style="pointer-events: all"
                                                class="btn btnHover fw-bold" onclick="supplierPaymenteSubmitButton()"
                                                id="btnAdd">
                                                <i class="fa-solid fa-plus"></i>
                                                Add
                                            </button>
                                        </div>
                                    </div><br><br>
                                </form>
                            </div>
                        </div>
                    </div><br>
                    <table class="table table-bordered bg-light table-striped" id="supplierPaymentTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Supplier Name</th>
                                <th>GRN No</th>
                                <th>Total amount</th>
                                <th>paid amount</th>
                                <th>Due amount</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalSupplierPayment">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Supplier Payment Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printSupplierPaymentData" class="table">
                        <tr>
                            <th>Supplier Name</th>
                            <td id="tdSuppliername"></td>
                        </tr>
                        <tr>
                            <th>GRN No</th>
                            <td id="tdgrnNo"></td>
                        </tr>
                        <tr>
                            <th>Total Amount</th>
                            <td id="tdTotalAmount"></td>
                        </tr>
                        <tr>
                            <th>Payment Amount</th>
                            <td id="tdpaymentAmount"></td>
                        </tr>
                        <tr>
                            <th>New Due Amount</th>
                            <td id="tdnewDueAmount"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printSupplierPaymentDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
