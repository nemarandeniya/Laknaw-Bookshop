<!DOCTYPE html>
<html lang="en">
<!-- user passowrd ->910204  user-> nemash-->
<!-- user passowrd ->54321  user-> Nishel-->
<!-- user passowrd ->12345  user-> Sadun-->

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link User css file -->
    <link rel="stylesheet" href="resources/style/user.css">

    <!-- link js file -->
    <script src="controllerjs/user.js"></script>
    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav th:replace="~{component::vertical-nav}"></nav>

    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">User</li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>User Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row ">
                <div class="col-1"></div>
                <div class="col-10">
                    <div class="d-flex">
                        <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseWidthExample" aria-expanded="false"
                            aria-controls="collapseWidthExample">
                            <i class="fa-solid fa-plus me-2"></i>Add new Details
                        </button>
                        <button class="btn btnHover ms-auto" onclick="printTableBtn(userTable,'User Details')">
                            <i class="fa-solid fa-print me-2"></i>Print</button>
                    </div>
                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="formId" onsubmit="return false">
                                    <!-- Employee -->
                                    <div class="row mt-5">
                                        <label for="employeeName" class="form-label fw-bold col-3">Employee :</label>
                                        <div class="col-9">
                                            <select id="selectEmployee" class="form-select" required
                                                onchange="selectDynamicValidator(selectEmployee,'user','employee_id')">
                                                <span class="ms-1">
                                                    <i class="fa-solid fa-circle-question" data-bs-toggle="tooltip"
                                                        data-bs-title="Pleace Select Employee"
                                                        data-bs-placement="bottom"></i>
                                                </span>
                                                <option value="" selected disabled>Select Employee</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- Username -->
                                    <div class="row mt-4">
                                        <lable for="empUsername" class="form-label fw-bold col-3">Username :</lable>
                                        <div class="col-9">
                                            <input type="text" class="form-control" id="textUsername"
                                                placeholder="Enter Username"
                                                onkeyup="textValidator(this,'^[A-Za-z]{4,10}$','user','username')">
                                        </div>
                                    </div>
                                    <!-- Password -->
                                    <div class="row mt-4">
                                        <label for="empPassword" class="form-label fw-bold col-3">Password :</label>
                                        <div class="col-9">
                                            <input type="password" class="form-control" id="textPassword"
                                                placeholder="Enter Your Password"
                                                onkeyup="textValidator(this,'^[A-Za-z0-9]{4,15}$','user','password')">
                                        </div>
                                    </div>
                                    <!-- Re-Password -->
                                    <div class="row mt-4">
                                        <label for="" class="form-label fw-bold col-3">Re-Password :</label>
                                        <div class="col-9">
                                            <input type="password" class="form-control" id="textrepassword"
                                                onkeyup="passwordRetypeValidator(this)">
                                        </div>
                                    </div>
                                    <!-- Email -->
                                    <div class="row mt-4">
                                        <label for="empEmail" class="form-label fw-bold col-3">Email :</label>
                                        <div class="col-9">
                                            <input type="email" class="form-control" id="textEmail" required
                                                placeholder="Enter Email"
                                                onkeyup="textValidator(this,'^[A-Za-z0-9]{6,20}[@][a-z]{3,6}[.][a-z]{2,3}$','user','email')">
                                        </div>
                                        <!-- Roles -->
                                        <div class="row mt-4">
                                            <label for="" class="col-3 col-form-label fw-bold">Role :</label>
                                            <div class="mb-3 form-check col-3" id="divRoles"></div>
                                        </div>
                                        <!-- Status -->
                                        <div class="row mt-4">
                                            <label for="" class="col-4 col-form-label fw-bold">Status :</label>
                                            <div class="mb-3 form-check col-8">
                                                <input type="checkbox" name="option" class="form-check-input"
                                                    id="chkStatus" onchange="if (chkStatus.checked) {
        user.status = true;
        labelUserStatus.innerText = 'User Account is Active ';
    } else {
        user.status = false;
        labelUserStatus.innerText = 'User Account is not-Active ';
    }">
                                                <label class="form-check-label" for="exampleCheck1"
                                                    id="labelUserStatus"></label>
                                            </div>
                                        </div>
                                        <!-- Buttons -->
                                        <div class="row mt-4 ">
                                            <div class="col-7">
                                                <button type="reset" class="btn btnHover">Clear</button>
                                            </div>
                                            <div class="col-3">
                                                <button type="submit" class="btn btnHover" id="btnUpdate"
                                                    onclick="updateUser()">Update</button>
                                            </div>
                                            <div class="col-2">
                                                <button type="submit" class="btn btnHover" id="btnAdd"
                                                    onclick="buttonUserFormSubmit()">Submit</button>
                                            </div>
                                        </div><br><br>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div><br><br>
                    <div class="bg-light">
                        <table class="table bg-light text-dark" id="userTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Employee</th>
                                    <th>User Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th class="modify-button">Modify</th>
                                </tr>
                            </thead>
                            <tbody class="table-body text-dark">

                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-1"></div>
            </div>
            <!-- form area end -->
            <!-- table area start -->
        </div>


    </div>

    <!-- Print option -->
    <div class="modal" id="printModalUser">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View User Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printUserData" class="table">
                        <tr>
                            <th>Employee</th>
                            <td id="tdEmployeeName"></td>
                        </tr>
                        <tr>
                            <th>User Name</th>
                            <td id="tdUsername"></td>
                        </tr>
                        <tr>
                            <th>Email</th>
                            <td id="tdEmail"></td>
                        </tr>
                        <tr>
                            <th>Role</th>
                            <td id="tdRole"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printDataBtn(printUserData)">Print</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
