<body>
    <div class="wrapper">
        <div class="form-box">
            <h1>LOGIN</h1>
            <form action="/login" method="post">

                <div class="input-box">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" id="textUsername" required><br>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" id="textPassword" required><br>
                    <label>Password</label>
                </div>

                <div class="text-center text-danger" th:if="${param.error}">
                    Invalid Username Password!
                </div>
                <div style="display: flex; gap: 10px; width: 50%;">
                    <button type="button" class="btn forgotPassword" onclick="forgotPasswordFunction()">Forgot
                        Password?</button>
                    <button type="submit" class="btn loginbtn">Log in</button>
                </div>
            </form>
        </div>
    </div>


    <div class="modal" id="forgotpasswordModel">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Forgot Password</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table">
                        <tr>
                            <th>Email</th>
                            <td id="tdEmail">
                                <input type="text" id="textUserEmail" placeholder="User Email" class="form-control"><br>
                                <div class="text-end">
                                    <!-- onkeyup="textValidator(this,'^[A-Za-z0-9]{6,20}[@][a-z]{3,6}[.][a-z]{2,3}$','logedUser','email')" -->
                                    <button class="btn btn-info" onclick="chaeckEmail()">Send OTP</button>
                                </div>
                            </td>
                        </tr>
                        <tr class="">
                            <th>OTP </th>
                            <td id="tdOTP">
                                <input type="text" id="textOtp" placeholder="Enter OTP" class="form-control"><br>
                                <div class="text-end">
                                    <button class="btn btn-info" onclick="">Submit</button>
                                </div>
                            </td>
                        </tr>
                        <tr class="">
                            <th>New Password</th>
                            <td id="tdNewPassword">
                                <input type="password" id="textNewPassword" class="form-control"
                                    placeholder="Enter New Password">
                                <!-- onkeyup="textValidator(this,'^[A-Za-z0-9]{4,15}$','logedUser','newpassword')" -->
                            </td>
                        </tr>
                        <tr class="">
                            <th>ReType Password</th>
                            <td id="tdRetypePassword">
                                <input type="password" id="textRetypePassword" class="form-control"
                                    placeholder="Retype Password">
                                <!-- onkeyup="textValidator(this,'^[A-Za-z0-9]{4,15}$','logedUser','newpassword')" -->
                            </td>
                        </tr>

                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="changePasswordBtn()">Change Password</button>
                </div>
            </div>
        </div>
    </div>
