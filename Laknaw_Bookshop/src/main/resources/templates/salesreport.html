<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>

    <title th:text="${title}"></title>



    <style th:replace="~{component::vertical-nav-style}"></style>
</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>

    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Sales Report
            </li>
        </ol>
    </nav>
    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2>Sales Report</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="container">
                <form class="row g-3 align-items-end">
                    <!-- Start Date -->
                    <div class="col-md-4  mb-2">
                        <label for="startDate" class="form-label">Start Date :<span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="startDate" name="startDate">
                    </div>

                    <!-- End Date -->
                    <div class="col-md-4 mb-2">
                        <label for="endDate" class="form-label">End Date :<span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="endDate" name="endDate">
                    </div>

                    <!-- Select Type -->
                    <div class="col-md-4 mb-2">
                        <label for="typeSelect" class="form-label">Select Type :<span
                                class="text-danger">*</span></label>
                        <select class="form-select" id="typeSelect" name="typeSelect">
                            <option selected disabled>Choose type</option>
                            <option value="Category">Category</option>
                            <option value="Sub-category">Sub-category</option>
                            <option value="Itemname">Item Name</option>
                            <option value="Month">Month</option>
                            <option value="Daily">Daily</option>
                        </select>
                    </div>


                </form><br><br>
                <div class="row">
                    <div class="col-6">
                        <table class="table bg-light" id="salesReportTable" style="border-radius: 2px;">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Total quantity</th>
                                </tr>
                            </thead>
                            <tbody class="table-body text-dark">
                            </tbody>
                        </table>
                    </div>
                    <div class="col-6" style="background-color: #ffffff; height: 300px;">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
                <br>
                <div class="d-flex gap-2">
                    <!-- Buttons -->
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btnHover" onclick="GenerateSalesReport()"><i
                                class="fa-solid bi bi-file-text me-2"></i>Genarate
                            Report</button>
                        <button type="button" class="btn btnHover" onclick="printSalesReport()"><i
                                class="fa-solid fa-print me-2"></i>Print</button>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <div th:replace="~{component::userProfileChangeModal}"></div>


    <!-- link js file -->
    <script src="resources/chart/chart.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->

    <script src="controllerjs/salesreport.js"></script>
</body>

</html>
