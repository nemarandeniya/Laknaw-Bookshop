<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link css file -->
    <link rel="stylesheet" href="resources/style/requestprice.css">

    <!-- link js file -->
    <script src="controllerjs/requestprice.js"></script>

    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">
    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Request price</li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <!-- title area -->
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>Request Price Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printReqPriceTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="reqPriceForm" onsubmit="return false">

                                    <!-- Supplier name -->
                                    <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="Supplier" class="col-4 col-form-label fw-bold">
                                                    Supplier : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <select id="selectSupplier" required class="form-select " onchange="selectDynamicValidator(this,'reqPrice','supplier_id')
                                                        filterItemBySuppliers()">
                                                        <option value="" selected diasabled></option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                    </div><br>

                                    <!-- select items -->
                                    <div class="row">
                                        <div class="col-5">
                                            <select class="form-select" multiple id="selectItems">
                                                <option value="" selected disabled>All Item</option>
                                            </select>
                                        </div>
                                        <div class="col-2">
                                            <button class="btn selectbtns" onclick="btnAddOneItem()">></button><br><br>
                                            <button class="btn selectbtns" onclick="btnAddAllItem()">>></button><br><br>
                                            <button class="btn selectbtns" onclick="btnRemoveOneItem()">
                                                < </button><br><br>
                                                    <button class="btn selectbtns" onclick="btnRemoveAllItem()">
                                                        << </button><br><br>
                                        </div>
                                        <div class="col-5">
                                            <select class="form-select" multiple id="selectSelectedItems">
                                                <option value="" selected disabled>Selected Item</option>
                                            </select>
                                        </div>
                                    </div><br>

                                    <!-- Required Date and status-->
                                    <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="reqDate" class="col-4 col-form-label fw-bold">
                                                    Required Date : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-folder-open fa-xs"></i>
                                                        </span>
                                                        <input type="date" id="selectDate" onkeydown="return false"
                                                            class="form-control" required
                                                            onchange="textValidator(this,'^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','reqPrice','required_date')">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Status : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <select id="selectStatus" class="form-select" required
                                                        onchange="selectDynamicValidator(this,'reqPrice','request_price_status_id')">
                                                        <option value="" disabled>Select status</option>
                                                        <option value="Requested" selected>Requested</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div><br>
                                    <!-- <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Note :
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-regular fa-comments"></i>
                                                        </span>
                                                        <textarea id="textNote" class="form-control"
                                                            placeholder="Add a comment"></textarea>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div><br> -->
                                    <div class="row">
                                        <div class="col-4">
                                            <button type="button" onclick=""
                                                class="btn btnHover fw-bold btn-clear all-button">
                                                <i class="fa-solid fa-recycle"></i>
                                                Clear
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" style="pointer-events: all"
                                                class="btn btnHover fw-bold me-2 ms-2 btn-update all-button"
                                                onclick="updateReqPrice()" id="btnUpdate">
                                                <i class="fa-solid fa-edit"></i>
                                                Update
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" style="pointer-events: all"
                                                class="btn btnHover fw-bold btn-add all-button"
                                                onclick="reqPriceSubmitButton()" id="btnAdd">
                                                <i class="fa-solid fa-plus"></i>
                                                Add
                                            </button>
                                        </div>
                                    </div><br><br>
                                </form>
                            </div>
                        </div>
                    </div><br>

                    <table class="table table-bordered bg-light table-striped" id="ReqPriceTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Supplier Name</th>
                                <th>Item Name</th>
                                <th>Required Date</th>
                                <th>Status</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalReqPrice">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Request PriceForm Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printReqPriceData" class="table">
                        <tr>
                            <th>Req No</th>
                            <td id="tdReqNo"></td>
                        </tr>
                        <tr>
                            <th>Supplier Name</th>
                            <td id="tdSupplier"></td>
                        </tr>
                        <tr>
                            <th>Item Name</th>
                            <td id="tdItem"></td>
                        </tr>
                        <tr>
                            <th>Required Date</th>
                            <td id="tdReqDate"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printReqPriceDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
