    <div class="row cardRow">

        <div class="card text-dark mb-3 mt-5 me-5 pt-4"
            style="width: 12rem; background-color: #ffffff; margin-top: 80px;">
            <div class="card-body text-center">
                <div class="row data">
                    <div class="col-3"><i class="fa-solid fa-user-tie rounded-circle p-3 me-2"
                            style="color: #B197FC; width: 40px; height: 40px; border-radius: 50%; background-color: #f2ebfc; display: inline-flex; align-items: center; justify-content: center;"></i>
                    </div>
                    <div class="col-9">
                        <h2 class="card-text fw-bold" id="staffCount">12</h2>
                        <h6 class="card-title" style="color: #888a97;"><span></span>Total Staff</h6>
                    </div>
                </div>

            </div>
        </div>
        <div class="card text-dark mb-3 mt-5 me-5 pt-4" style="width: 12rem; background-color: #ffffff;">
            <div class="card-body text-center">
                <div class="row">
                    <div class="col-3">
                        <i class="fa-solid fa-users me-2"
                            style="color: #ec1354; width: 40px; height: 40px; border-radius: 50%; background-color: #ffeef2; display: inline-flex; align-items: center; justify-content: center;"></i>
                    </div>
                    <div class="col-9">
                        <h2 class="card-text fw-bold" id="customerCount">43</h2>
                        <h6 class="card-title" style="color: #888a97;">Total Customers (This month)</h6>
                    </div>
                </div>
            </div>
        </div>
        <div class="card text-dark mb-3 mt-5 me-5 pt-4" style="width: 12rem; background-color: #ffffff;">
            <div class="card-body text-center">
                <div class="row">
                    <div class="col-3">
                        <i class="fa-solid fa-users me-2"
                            style="color: #ec1354; width: 40px; height: 40px; border-radius: 50%; background-color: #ffeef2; display: inline-flex; align-items: center; justify-content: center;"></i>
                    </div>
                    <div class="col-9">
                        <h2 class="card-text fw-bold" id="todayCustomerCount">43</h2>
                        <h6 class="card-title" style="color: #888a97;">Total Customers (Today)</h6>
                    </div>
                </div>
            </div>
        </div>
        <div class="card text-dark mb-3 mt-5 me-5 pt-4" style="width: 12rem; background-color: #ffffff;">
            <div class="card-body text-center">
                <div class="row">
                    <div class="col-3" id="stockLevelIcon">
                        <i class="fa-solid fa-triangle-exclamation me-2"
                            style="color: #ffd231; width: 40px; height: 40px; border-radius: 50%; background-color: #edebce; display: inline-flex; align-items: center; justify-content: center;"></i>
                    </div>
                    <div class="col-9">
                        <h2 class="card-text fw-bold" id="lawstock">10</h2>
                        <h6 class="card-title" style="color: #888a97;" id="stockNote">Law stock</h6>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="row chartRow">
        <div class="col-4" style="background-color: #ffffff; height: 300px;">
            <canvas id="myDashboardInvoiceChart" style="margin-top:10px; width: 100%; height: 100%;"></canvas>
        </div>
        <!-- <div class="col-1">
        </div> -->
        <div class="col-4" style="background-color: #ffffff; height: 300px; margin-left: 54px;">
            <canvas id="myDashboardPorderChart" width="250" height="250"
                style="margin-top:10px; width: 100%; height: 100%;"></canvas>
        </div>
    </div>
