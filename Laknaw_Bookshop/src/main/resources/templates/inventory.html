<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>

    <title th:text="${title}"></title>
    <!-- link Inventory css file -->
    <link rel="stylesheet" href="resources/style/inventory.css">

    <!-- link Inventory js file -->
    <script src="controllerjs/inventory.js"></script>
    <style th:replace="~{component::vertical-nav-style}"></style>
</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>


    <div class="container-fluid mt-2">
        <div class="card-body" style="margin-top: 100px;">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2>Inventory Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row ">
                <div class="col-1"></div>
                <div class="col-10">

                    <button class="btn btnHover" onclick="printInventoryTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <!-- table area start -->
                    <div class="card card-body" style="width: 1000px">
                        <table class="table table-bordered bg-light table-striped" id="inventoryTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Item</th>
                                    <th>Total qty</th>
                                    <th>Available qty</th>
                                    <th>Sales price</th>
                                    <th class="modify-button">Modify</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalInventory">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Inventory Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printInventoryData" class="table">
                        <tr>
                            <th>Item</th>
                            <td id="tdItem"></td>
                        </tr>
                        <tr>
                            <th>Total qty</th>
                            <td id="tdTotalQty"></td>
                        </tr>
                        <tr>
                            <th>Available qty</th>
                            <td id="tdAvailableQty"></td>
                        </tr>
                        <tr>
                            <th>Sales price</th>
                            <td id="tdSalesPrice"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printInventoryDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
