<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link User css file -->
    <link rel="stylesheet" href="resources/style/item.css">

    <!-- link js file -->
    <script src="controllerjs/item.js"></script>
    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Item</li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>Item Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printItemTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print
                    </button>
                    <div style="min-height: 10px;">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body text-dark" style="width: 1000px;">
                                <form id="formItem" onsubmit="return false">

                                    <div class="row mt-5">
                                        <div class="col-12">
                                            <span class="text-danger">*</span>Required
                                        </div>
                                    </div>

                                    <!-- Barcode -->
                                    <div class="row">
                                        <label for="" class="col-2 col-form-label fw-bold text-dark">
                                            Barcode : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-10">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-solid fa-barcode"></i>
                                                </span>
                                                <input type="text" class="form-control" id="textBarcode"
                                                    placeholder="Enter Item Barcode" required
                                                    onkeyup="textValidator(this,'^(([0-9]{12})|([0-9]{13}))$','item','barcode');" />
                                            </div>
                                        </div>
                                    </div><br>

                                    <!-- Category, Sub-category -->
                                    <div class="row">

                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            Category : <span class="text-danger">*</span>
                                        </label>
                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            Sub-category : <span class="text-danger">*</span>
                                        </label>
                                    </div>
                                    <div class="row">

                                        <div class="col-6">
                                            <select id="selectCategory" class="form-select" required onchange="selectDynamicValidator(this,'item','category_id')
                                                 filterSubCategoryAndBrand()">
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <select id="selectSubCategory" class="form-select" required
                                                onchange="selectDynamicValidator(this,'item','subcategory_id')">
                                            </select>
                                        </div>
                                    </div> <br>

                                    <!-- package type , brand type   -->
                                    <div class="row">
                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            Brand :
                                        </label>
                                        <!-- <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            Package-Type : <span class="text-danger">*</span>
                                        </label> -->
                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            Status : <span class="text-danger">*</span>
                                        </label>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <select id="selectBrand" class="form-select"
                                                onchange="selectDynamicValidator(this,'item','brand_id')">
                                                <option value="" selected disabled>Select Brand</option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <select id="selectStatus" class="form-select" required
                                                onchange="selectDynamicValidator(this,'item','itemstatus_id')">
                                            </select>
                                        </div>
                                    </div><br>
                                    <!-- item name -->
                                    <div class="row">
                                        <label for="textItemname" class="col-2 col-form-label fw-bold text-dark">
                                            Item name : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-10">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-solid fa-book"></i>
                                                </span>
                                                <input type="text" id="textItemname" class="form-control" required
                                                    placeholder="Enter Item Name"
                                                    onkeyup="textValidator(this,'^([A-Za-z0-9 ]{3,50})$','item','itemname');">
                                            </div>
                                        </div>
                                    </div><br>

                                    <!--Re-order quantity , Re-order point, status-->
                                    <div class="row">
                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            ROP :<span class="text-danger">*</span>
                                        </label>
                                        <label for="" class="col-6 col-form-label fw-bold text-dark">
                                            ROQ :<span class="text-danger">*</span>
                                        </label>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <input type="number" id="textReorderPoint" class="form-control"
                                                placeholder="enter Re-order point"
                                                onkeyup="textValidator(this,'^(2[0-5]|1[0-9]|[5-9])$','item','rop')">
                                        </div>
                                        <div class="col-6">
                                            <input type="number" max="30" min="5" id="textReorderQty"
                                                class="form-control" placeholder="enter Re-order quantity"
                                                onkeyup="textValidator(this,'^(2[0-5]|1[0-9]|[5-9])$','item','roq')">
                                        </div>
                                    </div><br>

                                    <!-- ISBN,Publisher , Publish date  -->
                                    <div class="row bookrow d-none">
                                        <label for="" class="col-4 col-form-label fw-bold text-dark">
                                            ISBN :
                                        </label>
                                        <label for="" class="col-4 col-form-label fw-bold text-dark">
                                            Publisher :
                                        </label>
                                        <label for="" class="col-4 col-form-label fw-bold text-dark">
                                            Publish Date :
                                        </label>
                                    </div>
                                    <div class="row bookrow d-none">
                                        <div class="col-4">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-solid fa-barcode"></i>
                                                </span>
                                                <input type="text" id="textIsbn" class="form-control"
                                                    onkeyup="textValidator(this,'^([0-9\-]{13,18})$','item','isbn')">
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-solid fa-building"></i>
                                                </span>
                                                <input type="text" id="textpublisher" class="form-control"
                                                    onkeyup="textValidator(this,'^([A-Za-z ]{5,30})$','item','publisher')">
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-regular fa-calendar-days"></i>
                                                </span>
                                                <input type="text" id="selectDate" class="form-control"
                                                    onkeyup="textValidator(this,'^(1[7-9][0-9]{2}|20[0-9]{2})$','item','publishdate')">
                                            </div>
                                        </div>
                                    </div><br>

                                    <!-- purchase price, sales price -->
                                    <!-- <div class="row">
                                         <div class="col-6">
                                            <label for="" class="col-form-label fw-bold">
                                                Purchace Price :<span class="text-danger">*</span>
                                            </label>
                                            <div class="input-group">
                                                <span class="input-group-text fw-bold">Rs </span>
                                                <input type="number" id="textPurchasePrice"
                                                    class="form-control required" placeholder="enter purchase price"
                                                    onkeyup="textValidator(this,'^(([1-9]{1}[0-9]{0,5})||([1-9]{1}[0-9]{0,5}[.][0-9]{2}))$','item','purchaseprice')">
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label for="" class="col-form-label fw-bold">
                                                Sales Price :<span class="text-danger">*</span>
                                            </label>
                                            <div class="input-group">
                                                <span class="input-group-text fw-bold">Rs </span>
                                                <input type="number" id="textSalePrice" class="form-control required"
                                                    placeholder="enter sales price"
                                                    onkeyup="textValidator(this,'^(([1-9]{1}[0-9]{0,5})||([1-9]{1}[0-9]{0,5}[.][0-9]{2}))$','item','saleprice')">
                                            </div>
                                        </div>  <div class="col-4">
                                            <label for="" class="col-form-label fw-bold text-dark">
                                                Profit-Rate : <span class="text-danger">*</span>
                                            </label>
                                            <input type="text" id="textprofitrate" class="form-control"
                                                onkeyup="textValidator(this,'^([0-9]{1,2}[.][0-9]{2})$','item','profitrate')">
                                        </div> 
                                    </div><br>-->


                                    <!-- description-->

                                    <div class="row">
                                        <label for="" class="col-4 col-form-label fw-bold text-dark">
                                            Description :
                                        </label>
                                        <div class="col-8">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa-solid fa-note-sticky"></i> </span>
                                                <textarea class="form-control"></textarea>
                                            </div>
                                        </div>
                                    </div><br><br>


                                    <div class="row">
                                        <div class="col-3">

                                            <button class="btn fw-bold btnHover"><span><i
                                                        class="fa-solid fa-broom"></i></span>
                                                Clear</button>
                                        </div>
                                        <div class="col-3">

                                        </div>
                                        <div class="col-3">
                                            <button class="btn fw-bold btnHover" id="btnUpdate"
                                                onclick="updateItem()"><span><i class="fa-solid fa-pen"></i></span>
                                                Update</button>
                                        </div>
                                        <div class="col-3">
                                            <button class="btn fw-bold btnHover" id="btnAdd"
                                                onclick="itemSubmitBtn()"><span><i
                                                        class="fa-solid fa-plus"></i></span>Add
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- form area end -->

                    <!-- table area start -->
                    <table class="table table-bordered bg-light table-striped" id="itemTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Item name</th>
                                <th>Item Barcode</th>
                                <th>Category</th>
                                <th>Brand</th>
                                <th>Profit-Rate</th>
                                <th>Status</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class=" col-1"></div>
            </div>
        </div>
    </div>



    <!-- Print option -->
    <div class="modal" id="printModalItem">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Item Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printItemData" class="table">
                        <tr>
                            <th>Item name</th>
                            <td id="tdItemName"></td>
                        </tr>
                        <tr>
                            <th>Barcode </th>
                            <td id="tdBarcode"></td>
                        </tr>
                        <tr>
                            <th>Sub-Category</th>
                            <td id="tdSubCategory"></td>
                        </tr>
                        <tr>
                            <th>Brand</th>
                            <td id="tdBrand"></td>
                        </tr>
                        <tr>
                            <th>Profit Rate</th>
                            <td id="tdProfitRate"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printItemDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
