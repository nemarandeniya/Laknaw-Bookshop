<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link css file -->
    <link rel="stylesheet" href="resources/style/pricelist.css">

    <!-- link js file -->
    <script src="controllerjs/pricelist.js"></script>

    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">
    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Price list</li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <!-- title area -->
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>Price List Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printPricelistTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="priceListForm" onsubmit="return false">
                                    <fieldset>
                                        <!-- supplier -->
                                        <div class="row">
                                            <label for="selectSupplier" class="col-3 col-form-label fw-bold">
                                                Supplier : <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-8">
                                                <select id="selectSupplier" class="form-select " onchange="selectDynamicValidator(this,'pricelist','supplier_id')
                                                filerReqPriceBySupplier();">
                                                    <option value="" selected diasabled></option>
                                                </select>
                                            </div>
                                        </div><br>
                                        <!-- Req price -->
                                        <div class="row">
                                            <label for="selectReqPrice" class="col-3 col-form-label fw-bold">
                                                Request Price : <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-8">
                                                <select id="selectReqPrice" class="form-select " onchange="selectDynamicValidator(this,'pricelist','request_price_id');
                                                    filterItemByRequstPrice()">
                                                    <option value="" selected diasabled></option>
                                                </select>
                                            </div>
                                        </div><br>


                                        <!-- Received Date -->
                                        <div class="row">
                                            <label for="selectReceivedDate" class="col-3 col-form-label fw-bold">
                                                Received Date : <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-8">
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="fa-solid fa-calendar-days"></i>
                                                    </span>
                                                    <input type="date" id="selectReceivedDate" onkeydown="return false"
                                                        class="form-control"
                                                        onchange="textValidator(this,'^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','pricelist','received_date')">
                                                </div>
                                            </div>
                                        </div><br>

                                        <!-- Deadline Date -->
                                        <div class="row">
                                            <label for="selectDeadlineDate" class="col-3 col-form-label fw-bold">
                                                Deadline Date : <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-8">
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="fa-solid fa-calendar-days"></i>
                                                    </span>
                                                    <input type="date" id="selectDeadlineDate" class="form-control"
                                                        onkeydown="return false"
                                                        onchange="textValidator(this,'^[0-9]{4}[-][0-9]{2}[-][0-9]{2}$','pricelist','deadline_date')">
                                                </div>
                                            </div>
                                        </div><br>


                                        <div class="row">
                                            <label for="selectStatus" class="col-3 col-form-label fw-bold">
                                                Status : <span class="text-danger">*</span>
                                            </label>
                                            <div class="col-8">
                                                <select id="selectStatus" class="form-select"
                                                    onchange="selectDynamicValidator(this,'pricelist','pricelist_status_id')">
                                                    <option value="" selected>Select status</option>
                                                </select>
                                            </div>
                                        </div><br>
                                        <!-- <div class="row mb-3">
                                            <label for="" class="col-3 col-form-label fw-bold">
                                                Note :
                                            </label>
                                            <div class="col-8">
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="fa-regular fa-comments"></i>
                                                    </span>
                                                    <textarea id="textNote" class="form-control"
                                                        placeholder="Add a comment"></textarea>
                                                </div>
                                            </div>
                                        </div><br> -->
                                    </fieldset>
                                    <fieldset>
                                        <legend>
                                            Item Pricelist
                                        </legend>
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="selectItem" class="col-4 col-form-label fw-bold">
                                                        Items : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-folder-open fa-xs"></i>
                                                            </span>
                                                            <select id="selectItem" class="form-select" required
                                                                onchange="selectDynamicValidator(this,'itemPriceList','item_id')"
                                                                oninput="filterItemByExistence()"> </select>
                                                        </div>

                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="textUnitPrice" class="col-4 col-form-label fw-bold">
                                                        Unit price : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-money-bill"></i>
                                                            </span>
                                                            <input type="text" id="textUnitPrice" class="form-control"
                                                                onchange="textValidator(this,'^(([1-9][0-9]{0,7})|([1-9][0-9]{0,7}[.][0-9]{2}))$','itemPriceList','unitprice')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row">
                                            <div class="col-4">
                                                <button type="button" onclick="" class="btn btnHover fw-bold">
                                                    <i class="fa-solid fa-recycle"></i>
                                                    Clear
                                                </button>
                                            </div>
                                            <div class="col-4">
                                                <button type="button" style="pointer-events: all"
                                                    class="btn btnHover fw-bold"
                                                    onclick="updateItemPriceListInnerForm()" id="btnItemUpdate">
                                                    <i class="fa-solid fa-edit"></i>
                                                    Update
                                                </button>
                                            </div>
                                            <div class="col-4">
                                                <button type="button" style="pointer-events: all"
                                                    class="btn btnHover fw-bold btn-add all-button"
                                                    onclick="submitItemPriceListInnerForm()" id="btnItemAdd">
                                                    <i class="fa-solid fa-plus"></i>
                                                    Add
                                                </button>
                                            </div>
                                        </div><br>
                                        <hr>
                                        <table class="table table-bordered bg-light table-striped"
                                            id="priceListInnerTable">
                                            <thead>
                                                <tr>
                                                    <th>#</th>
                                                    <th>Item Name</th>
                                                    <th>unit price</th>
                                                    <th class="modify-button">Modify</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                            </tbody>
                                        </table><br>
                                    </fieldset>
                                    <div class="row">
                                        <div class="col-4">
                                            <button type="button" onclick=""
                                                class="btn btnHover fw-bold btn-clear all-button">
                                                <i class="fa-solid fa-recycle"></i>
                                                Clear
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" style="pointer-events: all"
                                                class="btn btnHover fw-bold me-2 ms-2 btn-update all-button"
                                                onclick="updatePricelist()" id="btnUpdate">
                                                <i class="fa-solid fa-edit"></i>
                                                Update
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button type="submit" style="pointer-events: all"
                                                class="btn btnHover fw-bold btn-add all-button"
                                                onclick="pricelistSubmitButton()" id="btnAdd">
                                                <i class="fa-solid fa-plus"></i>
                                                Add
                                            </button>
                                        </div>
                                    </div><br><br>
                                </form>
                            </div>
                        </div>
                    </div><br>
                    <table class="table table-bordered bg-light table-striped" id="priceListTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Price List No</th>
                                <th>Received Date</th>
                                <th>Deadline Date</th>
                                <th>Request Price</th>
                                <th>Status</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalPriceList">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View PriceList Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printPricelistData" class="table">
                        <tr>
                            <th>PriceList No</th>
                            <td id="tdpricelistno"></td>
                        </tr>
                        <tr>
                            <th>Received Date</th>
                            <td id="tdRecevedDate"></td>
                        </tr>
                        <tr>
                            <th>Deadline Date</th>
                            <td id="tdDeadlinedate"></td>
                        </tr>
                        <tr>
                            <th>Request Price</th>
                            <td id="tdReqPrice"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printPricelistDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
