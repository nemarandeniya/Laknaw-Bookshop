<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>

    <title th:text="${title}"></title>
    <!-- link Employee css file -->
    <link rel="stylesheet" href="resources/style/customer.css">

    <!-- link js file -->
    <script src="controllerjs/customer.js"></script>
    <style th:replace="~{component::vertical-nav-style}"></style>
</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>

    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Customer</li>
        </ol>
    </nav>
    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2>Customer Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row ">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printCustomerTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>



                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="formCustomer" onsubmit="return false">
                                    <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="textCustomername" class="col-4 col-form-label fw-bold">
                                                    Customer Name : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-user"></i>
                                                        </span>
                                                        <input type="text" id="textCustomername" class="form-control"
                                                            required placeholder="Enter Customer Name"
                                                            onkeyup="textValidator(this,'^([A-Z][a-z]{2,20}[\\s])+([A-Z][a-z]{2,20})$','customer','customerName')" />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Email : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-envelope fa-xs"></i>
                                                        </span>
                                                        <input type="email" id="textEmail" class="form-control "
                                                            required placeholder=" Enter Email"
                                                            onkeyup="textValidator(this,'^[A-Za-z0-9\\_\\-]{8,20}[@][a-z]{3,10}[.][a-z]{2,3}$','customer','email')">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div><br>
                                    <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Contact : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-mobile-retro"></i>
                                                        </span>
                                                        <input type="number" id="textcontact" class="form-control "
                                                            required
                                                            onkeyup="textValidator(this,'^[0][7][01245678][0-9]{7}$','customer','contact')"
                                                            placeholder="Enter Contact Number">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Status : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-hourglass-half"></i>
                                                        </span>
                                                        <select id="selectStatus" class="form-select"
                                                            onchange="selectDynamicValidator(this,'customer','customerstatus_id')">
                                                            <option value="" selected disabled>Select your status
                                                            </option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div> -->
                                    </div>
                                    <br>
                                    <!-- <div class="row align-items-center">
                                        <div class="col-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Loyalty points : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-mobile-retro"></i>
                                                        </span>
                                                        <input type="text" id="textloyaltypoints" class="form-control "
                                                            required
                                                            onkeyup="textValidator(this,'^[0-9]+$','customer','loyalty_points')"
                                                            placeholder="Enter Loayalty Number">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div><br> -->

                                    <div class="row">
                                        <div class="col-3">
                                            <button class="btn btn-success btnHover"
                                                onclick="refreshCustomerForm()"><span><i
                                                        class="fa-solid fa-broom"></i></span>
                                                Clear</button>
                                        </div>
                                        <div class="col-3">

                                        </div>
                                        <div class="col-3">
                                            <button class="btn btn-success btnHover" id="btnUpdate"
                                                onclick="updateCustomer()"><span><i class="fa-solid fa-pen"></i></span>
                                                Update</button>
                                        </div>
                                        <div class="col-3">

                                            <button type="submit" class="btn btn-success btnHover" id="btnAdd"
                                                onclick="customerSubmitButton(customer)"><span><i
                                                        class="fa-solid fa-plus"></i></span>
                                                Add</button>
                                        </div>
                                    </div>
                                </form>
                                <!-- form area end -->
                            </div>
                        </div>
                    </div><br><br>
                    <!-- table area start table-bordered bg-light table-striped-->
                    <!-- <div class="card card-body"> -->
                    <table class="table bg-light" id="customerTable" style="border-radius: 2px;">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Customer Number</th>
                                <th>Customer Name</th>
                                <th>Contact</th>
                                <th>Email</th>
                                <th>Loyalty Points</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody class="table-body text-dark">
                        </tbody>
                    </table>
                    <!-- </div> -->
                </div>
                <div class="col-1"></div>
            </div>


        </div>


    </div>

    <!-- Print option -->
    <div class="modal" id="printModalCustomer">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Customer Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printCustomerData" class="table">
                        <tr>
                            <th>Customer Name</th>
                            <td id="tdFullName"></td>
                        </tr>
                        <tr>
                            <th>Contact</th>
                            <td id="tdContact"></td>
                        </tr>
                        <tr>
                            <th>Email</th>
                            <td id="tdEmail"></td>
                        </tr>

                        <tr>
                            <th>Loyalty Points</th>
                            <td id="tdloyaltyPoints"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printCustomerDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
