<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>

    <title th:text="${title}"></title>
    <!-- link Employee css file -->
    <link rel="stylesheet" href="resources/style/supplier.css">

    <!-- link js file -->
    <script src="controllerjs/supplier.js"></script>
    <style th:replace="~{component::vertical-nav-style}"></style>
</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>

    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Supplier</li>
        </ol>
    </nav>
    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2>Supplier Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row ">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printSupplierTableBtn()"><i
                            class="fa-solid fa-print me-2"></i>Print</button>



                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="formId" onsubmit="return false">

                                    <fieldset>
                                        <legend>Supplier details</legend><br>
                                        <!-- Supplier name, status -->
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 col-form-label fw-bold">
                                                        Supplier Name : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-user"></i>
                                                            </span>
                                                            <input type="text" id="textSuppliername"
                                                                class="form-control" required
                                                                placeholder="Enter Supplier Name"
                                                                onkeyup="textValidator(this,'^([A-Za-z0-9 .\&]{3,50})$','supplier','suppliername');" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 col-form-label fw-bold">
                                                        Address : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-location-dot"></i>
                                                            </span>
                                                            <input type="text" id="textAddress" class="form-control"
                                                                placeholder="Enter Your Address" required
                                                                onkeyup="textValidator(this, '^([A-Za-z0-9/.,\\s-]{5,100})$','supplier','address')">
                                                            <!-- ^([0-9\\/\\-\\sA-Za-z]{1,20}[\\,][\\s])+([A-Z][a-z0-9\\-]{1,20}[.])$ -->
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <!-- contact , email , address -->
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 form-label fw-bold">
                                                        Email : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-envelope fa-xs"></i>
                                                            </span>
                                                            <input type="email" id="textEmail" class="form-control "
                                                                required placeholder=" Enter Email"
                                                                onkeyup="textValidator(this,'^[A-Za-z0-9\\_\\-]{3,20}[@][a-z]{3,20}[.][a-z]{2,3}$','supplier','email')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 form-label fw-bold">
                                                        Contact : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-mobile-retro"></i>
                                                            </span>
                                                            <input type="number" id="textContact" class="form-control "
                                                                required
                                                                onkeyup="textValidator(this,'^[0][1-7][01245678][0-9]{7}$','supplier','contact')"
                                                                placeholder="Enter Mobile Number">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                    </fieldset>


                                    <fieldset>
                                        <legend>Agent details</legend><br>
                                        <!--Agent details -->
                                        <div class="row align-items-center">
                                            <div class="col-12">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-2 form-label fw-bold">
                                                        Agent Name : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-10">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-user"></i>
                                                            </span>
                                                            <input type="text" id="textAgentname" class="form-control"
                                                                required placeholder="Enter Agent Name"
                                                                onkeyup="textValidator(this,'^([A-Z][a-z]{2,20}[\\s])+([A-Z][a-z]{2,20})$','supplier','agentname');" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                        <div class="row align-items-center mb-3">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 form-label fw-bold">
                                                        Agent Email : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-envelope fa-xs"></i>
                                                            </span>
                                                            <input type="email" id="textAgentEmail"
                                                                class="form-control " required
                                                                placeholder=" Enter Email"
                                                                onkeyup="textValidator(this,'^[A-Za-z0-9\\_\\-]{8,20}[@][a-z]{3,10}[.][a-z]{2,3}$','supplier','agentemail')">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 col-form-label fw-bold">
                                                        Agent Contact :
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-mobile-retro"></i>
                                                            </span>
                                                            <input type="number" id="textAgentContact"
                                                                class="form-control " required
                                                                onkeyup="textValidator(this,'^[0][7][01245678][0-9]{7}$','supplier','agentcontact')"
                                                                placeholder="Enter Mobile Number">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br>
                                    </fieldset>
                                    <fieldset>
                                        <legend>Select items</legend><br>
                                        <!-- category,brand  -->
                                        <div class="row align-items-center">
                                            <div class="col-6">
                                                <div class="row align-items-center">
                                                    <label for="" class="col-4 col-form-label fw-bold">
                                                        Category : <span class="text-danger">*</span>
                                                    </label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-folder-open fa-xs"></i>
                                                            </span>
                                                            <select id="selectCategory" class="form-select" required
                                                                onchange="selectDynamicValidator(this,'supplier','category_id')
                                                                filerbrandbyCategory()">
                                                            </select>
                                                        </div>

                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-6 d-flex">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Brand : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <div class="input-group">
                                                        <span class="input-group-text">
                                                            <i class="fa-solid fa-tag fa-xs"></i>
                                                        </span>
                                                        <select id="selectBrand" class="form-select" required onchange="selectDynamicValidator(this,'supplier','brand_id')
                                                             filterItemByCategoryAndBrand()">
                                                        </select>
                                                    </div>

                                                </div>
                                            </div>
                                        </div><br>
                                        <!-- select items -->
                                        <div class="row">
                                            <div class="col-5">
                                                <select class="form-select" multiple id="selectItems">
                                                    <option value="" selected disabled>All Item</option>
                                                </select>
                                            </div>
                                            <div class="col-2">
                                                <button class="btn selectbtns"
                                                    onclick="btnAddOneItem()">></button><br><br>
                                                <button class="btn selectbtns"
                                                    onclick="btnAddAllItem()">>></button><br><br>
                                                <button class="btn selectbtns" onclick="btnRemoveOneItem()">
                                                    < </button><br><br>
                                                        <button class="btn selectbtns" onclick="btnRemoveAllItem()">
                                                            << </button><br><br>
                                            </div>
                                            <div class="col-5">
                                                <select class="form-select" multiple id="selectSelectedItems">
                                                    <option value="" selected disabled>Selected Item</option>
                                                </select>
                                            </div>
                                        </div><br>
                                    </fieldset><br>
                                    <div class="row align-items-center mb-3">
                                        <div class="col-md-6 d-flex">
                                            <button class="btn btn-outline-secondary mb-2 w-100" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#bankdetailsCollapse"
                                                aria-expanded="false">
                                                Bank Details
                                            </button>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="row align-items-center">
                                                <label for="" class="col-4 col-form-label fw-bold">
                                                    Supplier status : <span class="text-danger">*</span>
                                                </label>
                                                <div class="col-8">
                                                    <select id="selectStatus" class="form-select" required
                                                        onchange="selectDynamicValidator(this,'supplier','supplierstatus_id')">
                                                        <option>Active</option>
                                                        <option>In-active</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Bank details -->
                                        <div class="collapse" id="bankdetailsCollapse">
                                            <div class="card card-body" style="width: 465px;">
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Bank Name : <span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-building-columns fa-xs"></i>
                                                            </span>
                                                            <select id="selectBank" class="form-select" required
                                                                onchange="selectDynamicValidator(this,'supplier','bank_id')">
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div><br>
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Branch : <span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-location-pin fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textBranchName" class="form-control "
                                                                required placeholder=" Enter Branch Name"
                                                                onkeyup="textValidator(this,'^[A-Za-z]{4,20}$','supplier','branch')">
                                                        </div>
                                                    </div>
                                                </div><br>
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Account Name :<span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-user fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textAccountName"
                                                                class="form-control " required
                                                                placeholder=" Enter Account Name"
                                                                onkeyup="textValidator(this,'^([A-Z][a-z]{2,20}[\\s])+([A-Z][a-z]{2,20})$','supplier','accountname')">
                                                        </div>
                                                    </div>
                                                </div><br>
                                                <div class="row align-items-center mb-3">
                                                    <label class="col-4 form-label fw-bold">Account No :<span
                                                            class="text-danger">*</span></label>
                                                    <div class="col-8">
                                                        <div class="input-group">
                                                            <span class="input-group-text">
                                                                <i class="fa-solid fa-id-card fa-xs"></i>
                                                            </span>
                                                            <input type="text" id="textAccountNo" class="form-control "
                                                                required placeholder=" Enter Account Number"
                                                                onkeyup="textValidator(this,'^([0-9]{10,12})$','supplier','accountno')">
                                                            <!-- ^\d{10,12}$   d kiynne only digits -->
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div><br><br>

                                        <div class="row">
                                            <div class="col-3">

                                                <button class="btn btn-success fw-bold btnHover"><span><i
                                                            class="fa-solid fa-broom"></i></span>
                                                    Clear</button>
                                            </div>
                                            <div class="col-3">

                                            </div>
                                            <div class="col-3">
                                                <button class="btn btn-success fw-bold btnHover" id="btnUpdate"
                                                    onclick="updateSupplier()"><span><i
                                                            class="fa-solid fa-pen"></i></span>
                                                    Update</button>
                                            </div>
                                            <div class="col-3">

                                                <button type="submit" class="btn btn-success fw-bold btnHover"
                                                    id="btnAdd" onclick="buttonSupplierFormSubmit()"><span><i
                                                            class="fa-solid fa-plus"></i></span>
                                                    Add</button>
                                            </div>
                                        </div>
                                </form>
                                <!-- form area end -->
                            </div>
                        </div>
                    </div><br><br>
                    <!-- table area start -->
                    <table class="table table-bordered bg-light table-striped" id="supplierTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Reg no</th>
                                <th>Supplier</th>
                                <th>Agent Name</th>
                                <th>Items</th>
                                <th>Status</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalSupplier">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Supplier Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printSupllierData" class="table">
                        <tr>
                            <th>Reg no</th>
                            <td id="tdRegNo"></td>
                        </tr>
                        <tr>
                            <th>Supplier</th>
                            <td id="tdSupplier"></td>
                        </tr>
                        <tr>
                            <th>Agent Name</th>
                            <td id="tdAgentName"></td>
                        </tr>
                        <tr>
                            <th>Items</th>
                            <td id="tdItems"></td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td id="tdStatus"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printSupplierDataBtn()">Print</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
