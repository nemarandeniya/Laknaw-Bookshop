<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>
    <!-- link css file -->
    <link rel="stylesheet" href="resources/style/privilege.css">

    <!-- link js file -->
    <script src="controllerjs/privilege.js"></script>
    <style th:replace="~{component::vertical-nav-style}"></style>

    <title th:text="${title}"></title>
    <style th:replace="~{component::vertical-nav-style}"></style>

</head>

<body style="background-color:  #E6EBEE">
    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>
    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">Privelege</li>
        </ol>
    </nav>

    <div class="container-fluid mt-2">
        <div class="card-body">
            <!-- title area -->
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2><span><i class="fa-solid fa-user  me-3"></i> </span>Privilege Management</h2>
                </div>
            </div>

            <!-- form area start -->
            <div class="row">
                <div class="col-1"></div>
                <div class="col-10">
                    <button class="btn btnHover" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseWidthExample" aria-expanded="false"
                        aria-controls="collapseWidthExample">
                        <i class="fa-solid fa-plus me-2"></i>Add new Details
                    </button>
                    <button class="btn btnHover" onclick="printTableBtn(privilegeTable,'Privilege Details')"><i
                            class="fa-solid fa-print me-2"></i>Print</button>

                    <div style="min-height: 10px">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body  text-dark" style="width: 1000px">
                                <form id="privilegeForm" onsubmit="return false">
                                    <div class="row">
                                        <label for="role" class="col-3 col-form-label fw-bold">
                                            Role : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8">
                                            <select id="selectRole" class="form-select "
                                                onchange="selectDynamicValidator(this,'privilege','role_id')">
                                                <option value="" selected diasabled></option>
                                            </select>
                                        </div>
                                    </div><br>

                                    <div class="row">
                                        <label for="module" class="col-3 col-form-label fw-bold">
                                            Module : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8">
                                            <select id="selectModule" class="form-select "
                                                onchange="selectDynamicValidator(this,'privilege','module_id')">
                                                <option value="" selected diasabled></option>
                                            </select>
                                        </div>
                                    </div><br>

                                    <div class="row">
                                        <label class="col-3 col-form-label fw-bold">
                                            Select : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8 form-check">
                                            <input type="checkbox" name="option" class="form-check-input" id="chkSelect"
                                                onchange="if (this.checked) {
                                                    privilege.selpriv = true;
                                                    selectLabel.innerText= 'Select Privilege Granted'
                                                }else{
                                                    privilege.selpriv = false;
                                                    selectLabel.innerText= 'Select Privilege Not Granted'
                                                }">
                                            <label class="form-check-label" id="selectLabel">Select Privilege Not
                                                Granted</label>
                                        </div>
                                    </div><br>
                                    <div class="row">
                                        <label class="col-3 col-form-label fw-bold">
                                            Insert : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8 form-check">
                                            <input type="checkbox" name="option" class="form-check-input" id="chkInsert"
                                                onchange="if (this.checked) {
                                                privilege.insertpriv = true;
                                                insertLabel.innerText= 'Insert Privilege Granted'
                                            }else{
                                                privilege.insertpriv = false;
                                                insertLabel.innerText= 'Insert Privilege Not Granted'
                                            }">
                                            <label class="form-check-label" id="insertLabel">Insert Privilege Not
                                                Granted</label>
                                        </div>
                                    </div><br>
                                    <div class="row">
                                        <label class="col-3 col-form-label fw-bold">
                                            Update : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8 form-check">
                                            <input type="checkbox" name="option" class="form-check-input" id="chkUpdate"
                                                onchange="if (this.checked) {
                                                privilege.updpriv = true;
                                                updateLabel.innerText= 'Update Privilege Granted'
                                            }else{
                                                privilege.updpriv = false;
                                                updateLabel.innerText= 'Update Privilege Not Granted'
                                            }">
                                            <label class="form-check-label" id="updateLabel">Update Privilege Not
                                                Granted</label>
                                        </div>
                                    </div><br>
                                    <div class="row">
                                        <label class="col-3 col-form-label fw-bold">
                                            Delete : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8 form-check">
                                            <input type="checkbox" name="option" class="form-check-input" id="chkDelete"
                                                onchange="if (this.checked) {
                                                privilege.delpriv = true;
                                                deleteLabel.innerText= 'Select Privilege Granted'
                                            }else{
                                                privilege.delpriv = false;
                                                deleteLabel.innerText= 'Select Privilege Not Granted'
                                            }">
                                            <label class="form-check-label" id="deleteLabel">Delete Privilege Not
                                                Granted</label>
                                        </div>
                                    </div><br>
                                    <div class="row">
                                        <label for="status" class="col-3 col-form-label fw-bold">
                                            Status : <span class="text-danger">*</span>
                                        </label>
                                        <div class="col-8">
                                            <select id="selectStatus" class="form-select "
                                                onchange="selectDynamicValidator(this,'privilege','privilegestatus_id')">
                                                <option value="" selected diasabled></option>
                                            </select>
                                        </div>
                                    </div><br>
                                    <div class="row mt-4 ">
                                        <div class="col-7">
                                            <button type="reset" class="btn btnHover "><span><i
                                                        class="fa-solid fa-broom"></i></span>Clear</button>
                                        </div>
                                        <div class="col-3">
                                            <button type="submit" class="btn btnHover" onclick="updatePrivilege()"
                                                id="btnUpdate"><span><i
                                                        class="fa-solid fa-pen"></i></span>Update</button>
                                        </div>
                                        <div class="col-2">
                                            <button type="submit" class="btn btnHover" id="btnAdd"
                                                onclick="privilegeSubmitButton()"><span><i
                                                        class="fa-solid fa-plus"></i></span>Add</button>
                                        </div>
                                    </div><br><br>
                                </form>
                            </div>
                        </div>
                    </div><br>
                    <table class="table table-bordered bg-light table-striped" id="privilegeTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Role</th>
                                <th>Module</th>
                                <th>Select</th>
                                <th>Insert</th>
                                <th>Update</th>
                                <th>Delete</th>
                                <th>Status</th>
                                <th class="modify-button">Modify</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
                <div class="col-1"></div>
            </div>
        </div>
    </div>

    <!-- Print option -->
    <div class="modal" id="printModalPrivilege">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>View Privilege Detail</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table id="printPrivilegeData" class="table">
                        <tr>
                            <th>Role</th>
                            <td id="tdRole"></td>
                        </tr>
                        <tr>
                            <th>Module</th>
                            <td id="tdModule"></td>
                        </tr>
                        <tr>
                            <th>Select</th>
                            <td id="tdSelect"></td>
                        </tr>
                        <tr>
                            <th>Insert</th>
                            <td id="tdInsert"></td>
                        </tr>
                        <tr>
                            <th>Update</th>
                            <td id="tdUpdate"></td>
                        </tr>
                        <tr>
                            <th>Delete</th>
                            <td id="tdDelete"></td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-info" onclick="printDataBtn(printPrivilegeData)">Print</button>
                </div>
            </div>
        </div>
    </div>


    <div th:replace="~{component::userProfileChangeModal}"></div>

</body>

</html>
