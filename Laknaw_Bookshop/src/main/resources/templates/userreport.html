<!DOCTYPE html>
<html lang="en">

<head th:replace="~{component::headerFragment}"></head>

<head>

    <title th:text="${title}"></title>
    <!-- link Employee css file -->
    <link rel="stylesheet" href="resources/style/employee.css">


    <style th:replace="~{component::vertical-nav-style}"></style>
</head>

<body style="background-color:  #E6EBEE">

    <nav th:replace="~{component::vertical-nav}"></nav>
    <nav th:replace="~{component::navbarFragment}"></nav>

    <nav aria-label="breadcrumb" class="text-center text-dark" style="margin-top: 100px;margin-left: 50px;">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" style="background-color:  #E6EBEE" aria-current="page">User Report</li>
        </ol>
    </nav>
    <div class="container-fluid mt-2">
        <div class="card-body">
            <div class="row m-3">
                <div class="text-center text-dark">
                    <h2>User Report</h2>
                </div>
            </div>
            <div class="container">
                <form>

                    <div class="row g-3 align-items-end">
                        <!-- Select Designation -->
                        <div class="col-md-4  mb-2">
                            <label for="typeSelect" class="form-label">Select Designation</label>
                            <select class="form-select" id="typeSelect" name="typeSelect">
                                <option selected disabled>Select Designation</option>
                                <option value="type1">Cashier</option>
                                <option value="type2">Type 2</option>
                                <option value="type3">Type 3</option>
                            </select>
                        </div>

                        <!-- Select Status -->
                        <div class="col-md-4  mb-2">
                            <label for="typeSelect" class="form-label">Select Status</label>
                            <select class="form-select" id="typeSelect" name="typeSelect">
                                <option selected disabled>Select Status</option>
                                <option value="type1">Active</option>
                                <option value="type2">Type 2</option>
                                <option value="type3">Type 3</option>
                            </select>
                        </div>

                    </div>
                </form>
            </div>
            <div class="row">
                <div class="col-8">
                    <table class="table bg-light" id="userTable" style="border-radius: 2px;">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Employee</th>
                                <th>User Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>

                            </tr>
                        </thead>
                        <tbody class="table-body text-dark">
                            <tr>
                                <td>1</td>
                                <td>Pramod Kaushal</td>
                                <td>Pramod</td>
                                <td>pramod@gmail.com</td>
                                <td>Cashier</td>
                                <td>Active</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Sahan Nimna</td>
                                <td>Sahan</td>
                                <td>sahan@gmail.com</td>
                                <td>Cashier</td>
                                <td>Active</td>
                            </tr>

                        </tbody>
                    </table><br>
                </div>
                <div class="col-4">
                    <canvas id="myChart"></canvas>
                </div>
            </div>

            <!-- Buttons -->
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btnHover"><i class="fa-solid bi bi-file-text me-2"></i>Genarate
                    Report</button>
                <button type="button" class="btn btnHover" onclick="printUserReport()"><i
                        class="fa-solid fa-print me-2"></i>Print</button>
            </div>
            <!-- </div> -->
        </div>
        <div class="col-1"></div>
    </div>


    </div>


    </div>



    <div th:replace="~{component::userProfileChangeModal}"></div>

    <!-- link js file -->
    <!-- <script src="chart/chart.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="controllerjs/userreport.js"></script>
</body>

</html>
